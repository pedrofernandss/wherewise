services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # mapa base (ruas/satélite) do Azure Maps; sem a chave o mapa mostra só as camadas do projeto
      AZURE_MAPS_KEY: ${AZURE_MAPS_KEY:-}
      # IA com Claude (sem a chave o /api/ask devolve o trecho mais relevante do plano)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # Chat (/api/chat): busca no Bing; sem a chave usa a busca web nativa do Claude
      BING_SUBSCRIPTION_KEY: ${BING_SUBSCRIPTION_KEY:-}
      BING_SEARCH_URL: ${BING_SEARCH_URL:-https://api.bing.microsoft.com/v7.0/search}
